name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - renovate.json
      - .github/renovate-runner.json
      - .github/workflows/renovate.yaml

permissions: {}

concurrency:
  group: renovate-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Dependency proposals
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: write
    steps:
      - name: Checkout trusted default-branch event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Renovate proposals and dashboard
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          configurationFile: .github/renovate-runner.json
          token: ${{ github.token }} # GITHUB_TOKEN; no PAT/App credential
          renovate-image: ghcr.io/renovatebot/renovate:44.142.1-full@sha256:11fad8714c1c1a0283df4dea350299d634bd55de4aef7b752f762ed78c0ae417
          mount-docker-socket: 'false'
          docker-volumes: ''
          env-regex: '^(RENOVATE_REPOSITORIES|RENOVATE_ENDPOINT|RENOVATE_PRINT_CONFIG|LOG_LEVEL)$'
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ENDPOINT: ${{ github.api_url }}
          RENOVATE_PRINT_CONFIG: 'true'
          LOG_LEVEL: debug

  pr-check:
    name: Validate Renovate configuration
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout proposed PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate repository and runner configuration
        shell: bash
        env:
          RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.142.1-full@sha256:11fad8714c1c1a0283df4dea350299d634bd55de4aef7b752f762ed78c0ae417
        run: |
          set -euo pipefail
          test -f renovate.json
          # Only the read-only checkout is mounted; no token, host cache or socket is passed.
          container=(docker run --rm
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly"
            --workdir /workspace)
          "${container[@]}" --entrypoint renovate-config-validator "$RENOVATE_IMAGE" \
            --strict --no-global /workspace/renovate.json
          "${container[@]}" --entrypoint renovate-config-validator "$RENOVATE_IMAGE" \
            --strict /workspace/.github/renovate-runner.json
