[workspace]
members = [".", "web"]
default-members = ["."]

[workspace.package]
version = "0.5.0"
edition = "2024"

[package]
name = "cvss-rs"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
description = "A Rust library for representing and deserializing CVSS (Common Vulnerability Scoring System) data."
license = "Apache-2.0"
repository = "https://github.com/scm-rs/cvss-rs"
homepage = "https://github.com/scm-rs/cvss-rs"
documentation = "https://docs.rs/cvss-rs"
keywords = ["cvss", "security", "vulnerability", "scoring"]
categories = ["parser-implementations", "data-structures", "security"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
anyhow = "1.0"
rstest = "0.26"
walkdir = "2"
indicatif = { version = "0.18", features = ["rayon"] }
rayon = "1.5"

[profile.walkall]
inherits = "test"
